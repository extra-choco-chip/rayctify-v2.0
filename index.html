<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>RayCtify Enterprise AI Fairness Suite</title>
    
    <!-- Tailwind CSS (CDN as per mockups) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    
    <!-- Custom Styles -->
    <link href="styles.css" rel="stylesheet"/>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#c0ecdb",
                      "primary-fixed": "#c1ecd4",
                      "on-primary-fixed": "#002114",
                      "tertiary-fixed": "#ffdcbd",
                      "tertiary-fixed-dim": "#f0bd8b",
                      "surface-beige": "#F2EFE9",
                      "on-tertiary-fixed": "#2c1600",
                      "inverse-primary": "#a5d0b9",
                      "on-surface-variant": "#414844",
                      "on-secondary-fixed": "#002018",
                      "on-error": "#ffffff",
                      "dark-primary": "#2D6A4F",
                      "on-secondary": "#ffffff",
                      "background": "#fcf9f8",
                      "background-ivory": "#FCFAF7",
                      "on-background": "#1c1b1b",
                      "surface": "#fcf9f8",
                      "on-tertiary-fixed-variant": "#623f18",
                      "dark-card": "#1E1E1E",
                      "tertiary": "#3b1f00",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#313030",
                      "surface-tint": "#3f6653",
                      "on-secondary-fixed-variant": "#254e42",
                      "on-primary-container": "#86af99",
                      "on-surface": "#1c1b1b",
                      "tertiary-container": "#56340e",
                      "secondary-container": "#bde9d8",
                      "surface-dim": "#dcd9d9",
                      "surface-container-highest": "#e5e2e1",
                      "outline": "#717973",
                      "on-secondary-container": "#426a5d",
                      "primary-fixed-dim": "#a5d0b9",
                      "secondary": "#3e6659",
                      "on-error-container": "#93000a",
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#a4d0c0",
                      "surface-variant": "#e5e2e1",
                      "on-tertiary-container": "#cd9d6d",
                      "primary": "#012d1d",
                      "dark-bg": "#121212",
                      "on-tertiary": "#ffffff",
                      "primary-container": "#1b4332",
                      "surface-container": "#f0eded",
                      "error": "#ba1a1a",
                      "on-primary-fixed-variant": "#274e3d",
                      "outline-variant": "#c1c8c2",
                      "surface-bright": "#fcf9f8",
                      "dark-text": "#F8F5F2",
                      "surface-container-high": "#eae7e7",
                      "surface-container-low": "#f6f3f2",
                      "inverse-on-surface": "#f3f0ef"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "24px",
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "margin-desktop": "40px",
                      "base": "8px"
              },
              "fontFamily": {
                      "data-mono": ["Public Sans"],
                      "label-md": ["Public Sans"],
                      "display-lg": ["Playfair Display"],
                      "body-md": ["Public Sans"],
                      "headline-md": ["Playfair Display"],
                      "headline-lg": ["Playfair Display"],
                      "headline-lg-mobile": ["Playfair Display"],
                      "title-lg": ["Public Sans"],
                      "body-lg": ["Public Sans"]
              },
              "fontSize": {
                      "data-mono": ["14px", {"lineHeight": "20px","letterSpacing": "-0.01em","fontWeight": "500"}],
                      "label-md": ["12px", {"lineHeight": "16px","letterSpacing": "0.05em","fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px","letterSpacing": "-0.02em","fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px","fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px","fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px","fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px","fontWeight": "600"}],
                      "title-lg": ["20px", {"lineHeight": "28px","fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px","fontWeight": "400"}]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background-ivory text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
    <a href="#app-content" class="sr-only focus:not-sr-only focus:absolute focus:z-[200] focus:m-2 focus:px-3 focus:py-2 focus:bg-primary focus:text-on-primary focus:rounded">Skip to content</a>
    <div id="toast-stack" aria-live="polite"></div>

    <!-- Sign-in / sign-up -->
    <div id="auth-content" class="flex-1 w-full flex-col hidden"></div>

    <!-- App shell -->
    <div id="shell" class="flex-1 w-full flex-col hidden">
        <header class="flex items-center justify-between gap-4 w-full px-4 md:px-margin-desktop h-16 sticky top-0 z-50 bg-background-ivory border-b border-surface-variant">
            <div class="flex items-center gap-3 min-w-0">
                <button id="menu-btn" class="md:hidden text-primary" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><span class="material-symbols-outlined">menu</span></button>
                <img src="logo.svg" alt="" class="h-8 w-8 shrink-0">
                <span id="org-name" class="font-headline-md text-headline-md font-bold text-primary truncate">RayCtify</span>
            </div>

            <form id="global-search" role="search" class="hidden md:block flex-1 max-w-md">
                <div class="relative w-full">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" aria-hidden="true">search</span>
                    <input id="global-search-input" type="search" aria-label="Search audits" placeholder="Search audits and press Enter" class="w-full h-11 pl-10 pr-4 rounded-lg bg-surface-beige border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md"/>
                </div>
            </form>

            <div class="flex items-center gap-3 shrink-0">
                <a id="bell" href="#/appeals" class="relative text-primary hidden" aria-label="Open appeals">
                    <span class="material-symbols-outlined">notifications</span>
                    <span id="bell-dot" class="hidden absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-error text-on-error text-[10px] font-bold leading-4 text-center"></span>
                </a>
                <div class="hidden sm:flex items-center gap-2 bg-surface-beige px-3 py-1.5 rounded-full border border-surface-variant" id="user-profile-badge">
                    <span class="material-symbols-outlined text-primary" aria-hidden="true">account_circle</span>
                    <span class="font-label-md text-label-md font-semibold text-primary" id="user-display-name"></span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-primary text-on-primary font-bold uppercase tracking-wider" id="user-role-badge"></span>
                </div>
                <button id="logout-btn" class="flex items-center gap-2 bg-[#ffdad6] text-[#ba1a1a] px-3 py-1.5 rounded-full hover:opacity-90" title="Log out">
                    <span class="material-symbols-outlined text-[18px]" aria-hidden="true">logout</span>
                    <span class="font-label-md text-label-md hidden sm:block">Log out</span>
                </button>
            </div>
        </header>

        <div class="flex flex-1 w-full max-w-container-max mx-auto relative">
            <aside id="sidebar" class="hidden md:flex fixed left-0 top-16 h-[calc(100vh-64px)] w-64 flex-col p-4 z-40 bg-surface-beige border-r border-surface-variant">
                <div class="mb-8 px-3">
                    <h2 class="font-title-lg text-title-lg text-primary mb-1" id="sidebar-title"></h2>
                    <p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" id="sidebar-subtitle"></p>
                </div>
                <nav class="flex-1 space-y-1" id="sidebar-nav-list" aria-label="Main"></nav>
            </aside>
            <main id="app-content" tabindex="-1" class="flex-1 w-full md:ml-64 bg-background-ivory min-h-[calc(100vh-64px)] transition-opacity duration-200"></main>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="app.js"></script>
    <script src="pages.js"></script>
    <script src="views.js"></script>
</body>
</html>
